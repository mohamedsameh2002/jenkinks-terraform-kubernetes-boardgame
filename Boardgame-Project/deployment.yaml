apiVersion: apps/v1
kind: Deployment
metadata:
  name: boardgame
spec:
  replicas: 2

  selector:
    matchLabels:
      app: boardgame

  template:
    metadata:
      labels:
        app: boardgame

    spec:
      containers:
        - name: boardgame
          image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/boardgame:latest

          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: boardgame-service
spec:
  type: LoadBalancer

  selector:
    app: boardgame

  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP